baseURL = "https://otmnsh.gitlab.io/blog/"   # <- set to your real Pages URL / custom domain
locale = "en-gb"
title = "Otmane Echaibi"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = false
pagerSize = 8
summaryLength = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON is required by PaperMod's search page

[minify]
  minifyOutput = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]

# The post front matter uses categories and concepts as well as tags.
[taxonomies]
  category = "categories"
  tag = "tags"
  concept = "concepts"

[params]
  env = "production"
  description = "Mathematics rebuilt from the question that started it, by an amateur who found school math dry."
  author = "Otmane Echaibi"
  images = ["images/profile.png"]   # default image for link previews
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = true
  ShowToc = false                   # matches toc = false in every post
  TocOpen = false
  ShowFullTextinRSS = true          # readers get the whole post in their feed reader
  ShowRssButtonInSectionTermList = true
  disableSpecial1stPost = false
  DateFormat = "2 January 2006"

  [params.assets]
    disableHLJS = true
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "favicon-32x32.png"

  # Front page: a short intro, plus two doors.
  [params.profileMode]
    enabled = true
    title = "Amateur mathematician."
    subtitle = "Mathematics the way it was discovered: a question, some wrong guesses, then the idea. No prior knowledge needed."
    imageUrl = "images/profile.png"
    imageTitle = "Otmane Echaibi"
    imageWidth = 160
    imageHeight = 160

    [[params.profileMode.buttons]]
      name = "Read the posts"
      url = "posts/"
    [[params.profileMode.buttons]]
      name = "About me"
      url = "about/"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "index"
    name = "Index"
    url = "/concepts/"
    weight = 35
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 50
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 60
